# Lily58 固件构建矩阵（DYA Studio + 板载 OLED 版）
#
# 由 `west zmk-build` 驱动（来自 cormoran/zmk-west-commands）。
# 注意：artifact 字段名是 `artifact`，不是官方工作流的 `artifact-name`。
#
# central 半边（lily58_left）必须带 lily58-central + studio-rpc-usb-uart：
# 前者装 DYA Studio 全部 Kconfig，后者提供 USB CDC-ACM 传输通道。
# 漏掉任一都会「编译通过但 DYA Studio 连不上」。
# peripheral 半边（lily58_right）只带 lily58-peripheral，绝不能开 Studio RPC。
---
include:
  ## 左手 = central：OLED + DYA Studio + USB Studio RPC
  - board: nice_nano//zmk
    shield: lily58_left
    snippets: [lily58-oled, lily58-central, studio-rpc-usb-uart]
    artifact: lily58_left_oled

  ## 右手 = peripheral：OLED
  - board: nice_nano//zmk
    shield: lily58_right
    snippets: [lily58-oled, lily58-peripheral]
    artifact: lily58_right_oled

  ## 设置重置固件（刷这个可把 DYA Studio 里改坏的设置恢复默认）
  - board: nice_nano//zmk
    shield: settings_reset
    artifact: settings_reset
