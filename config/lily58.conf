# Lily58 通用配置（左手 central / 右手 peripheral 共用）
#
# ⚠️ 不要在这里写任何 central 专属配置（ZMK_STUDIO / *_STUDIO_RPC /
#    ZMK_SPLIT_BLE_CENTRAL_* / Studio RPC 缓冲与栈）—— 本文件对两半同时生效，
#    外设半边没有 ZMK_STUDIO_RPC（protobuf 桩只在 central 生成），强开会在
#    编译期因缺 proto/zmk/custom.pb.h 失败。那些配置放 snippets/lily58-central/。
# ⚠️ 不要设置 CONFIG_ZMK_SPLIT_ROLE_CENTRAL —— 分体角色由 fork 自带的
#    lily58 Kconfig.defconfig 决定（LEFT = central）。
# ⚠️ 显示（OLED / nice!view）由 build.yaml 的 snippet 选择，此处不开
#    CONFIG_ZMK_DISPLAY。

CONFIG_ZMK_KEYBOARD_NAME="Caldera"

# 电源管理（DYA Studio 电源面板可实时调整）
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# 发射功率 +8dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 蓝牙连接数（+1 留给 peripheral）
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# 逐键防抖（沿用原配置）
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=20
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20

# 电池上报
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# 鼠标键行为：keymap 里的 mkp / mouseclick_keypress 依赖它
CONFIG_ZMK_POINTING=y

# 分体事件中继：DYA Studio 里改的设置同步到外设半边
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# 资源与协议
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Zephyr 4.1 默认开启 console，键盘不需要（排查时可用 -S zmk-usb-logging）
CONFIG_CONSOLE=n

# 原配置里的 32kHz 晶振兼容项，保留
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
