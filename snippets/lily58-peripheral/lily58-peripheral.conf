# 右手 = peripheral（外设半边）
#
# 由 build.yaml 每个 peripheral 变体的 snippets: 引入（-S lily58-peripheral）。
#
# ⚠️ 绝不能在这里写 ZMK_STUDIO / ZMK_STUDIO_RPC / 任何 *_STUDIO_RPC：
#    Studio 的 protobuf 桩代码只在 central 生成，右手开这些会因缺
#    proto/zmk/custom.pb.h 编译失败。

# 设备设置：接收并应用 central 中继过来的设置变更
CONFIG_ZMK_SETTINGS_RPC=y

# 自定义设置：中继接收端
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# 其余通用配置（键盘名 / 蓝牙 / 电池 / sleep / split relay / 栈）两半共用，
# 放在 config/lily58.conf。
